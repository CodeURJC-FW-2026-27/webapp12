{{> header}}

<main class="container py-5 text-center">
    <h1 class="mb-4">{{title}}</h1>

    <!-- Green box with the confirmation message -->
    <div class="alert alert-success" style="max-width: 600px; margin: 0 auto;">
        {{message}}
    </div>

    <!-- Button that leads to the page of choice -->
    <a href="{{nextUrl}}" class="btn btn-primary mt-4">{{nextText}}</a>
</main>

{{> footer}}
