<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>GAMELINE - A web for browsing videogames</title>

    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="IMAGES/gameline pequeño.ico" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" />
</head>

<body>
    <!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <!-- LOGO -->
            <img src="gameline pequeño.png" alt="Logo" width="48" height="48" class="d-inline-block align-text-top">
            <a class="navbar-brand">GAMELINE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">

                </ul>



                <button class="btn btn-outline-dark border border-2 text-white" type="submit"
                    style="margin-right: 10px;">

                    <a href="New.html" class="text-white">Add a new game </a>

                </button>
                <form action="/" method="get" class="d-flex">
                    {{#genre}}<input type="hidden" name="genre" value="{{.}}">{{/genre}}
                    <input type="text" name="search" value="{{search}}" placeholder="Search..." aria-label="Search by title">
                    <button type="submit" class="btn btn-outline-dark border border-2 text-white" style="margin-right: 10px;">
                        Search</button>
                </form>
            </div>
        </div>

    </nav>



    <section class="py-5">
        <div class="container px-4 px-lg-5 mt-5">
             <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">
                <a class="btn btn-outline-dark {{#allGenresActive}}active{{/allGenresActive}}" href="{{allGenresUrl}}">All genres</a>
                {{#genres}}
                <a class="btn btn-outline-dark {{#active}}active{{/active}}" href="{{url}}">{{label}}</a>
                {{/genres}}
            </div>
            <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-3 justify-content-center">
                {{#posts}}
                <div class="col mb-5">
                    <div class="card h-100">
                        <!-- Product image-->
                        {{#imageFilename}}
                        <img class="card-img-top" src="/post/{{_id}}/image" alt="{{Title}}" />
                        {{/imageFilename}}
                        <!-- Product details-->
                        <div class="card-body p-4">
                            <div class="text-center">
                                <!-- Product name-->
                                <h5 class="fw-bolder">{{Title}}</h5>
                                <!-- Product price-->
                                <strong>Price:</strong> ${{price}}
                            </div>
                        </div>
                        <!-- Product actions-->
                        <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                            <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="/post/{{_id}}">More
                                    info</a></div>
                        </div>
                    </div>
                </div>
                {{/posts}}
            </div>

            {{^posts}}
            <p class="text-center">No posts yet.</p>
            {{/posts}}

        </div>
    </section>



    <!-- Footer-->
    <footer class="py-5 bg-light">
        <div class="container">
            <p class="m-0 text-center text-white">Copyright &copy; GAMELINE</p>
        </div>
    </footer>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
</body>

</html>
