{{> header}}
    <div class="container my-5" style="max-width: {{#isEdit}}1100px{{/isEdit}}{{^isEdit}}600px{{/isEdit}};">
        <div class="row g-4">
    <div class="{{#isEdit}}col-md-6{{/isEdit}}{{^isEdit}}col-12{{/isEdit}}">
        <h1 class="mb-4">{{formTitle}}</h1>

        <form action="{{action}}" method="post" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label" for="Title">Title</label>
                <input class="form-control" type="text" id="Title" name="Title" value="{{post.Title}}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="company">Company</label>
                <input class="form-control" type="text" id="company" name="company" value="{{post.company}}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="date">Release date</label>
                <input class="form-control" type="date" id="date" name="date" value="{{post.date}}" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="price">Price</label>
                <input class="form-control" type="number" id="price" name="price" value="{{post.price}}"
                    min="0" max="1000" step="0.01" required>
            </div>

            <div class="mb-3">
                         <div class="mb-3">
     <label class="form-label" for="description">Description (20-500 characters)</label>
                <textarea class="form-control" id="description" name="description" rows="4"
                    minlength="20" maxlength="500" required>{{post.description}}</textarea>
            </div>   
                <label class="form-label" for="genre">Genre</label>
                <select class="form-select" id="genre" name="genre">
                    {{#genres}}
                    {{#selected}}
                       <option value="{{name}}" selected>{{name}}</option>
                    {{/selected}}

                    {{^selected}}
                     <option value="{{name}}">{{name}}</option>
                    {{/selected}}
                    {{/genres}}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label" for="image">Image</label>
                <input class="form-control" type="file" id="image" name="image" accept="image/*">
                {{#isEdit}}<div class="form-text">Leave empty to keep the current image.</div>{{/isEdit}}
            </div>

            <button type="submit" class="btn btn-outline-dark">Save</button>
            <a href="{{cancelUrl}}" class="btn btn-outline-secondary">Cancel</a>

          </form>
        </div>

           {{#isEdit}}
        <div class="col-md-6">
         <h2 class="mb-4">Current image:</h2>

            {{#post.imageFilename}}
            <img src="/post/{{post._id}}/image"
                 alt="{{post.Title}}"
                 class="img-fluid rounded border"
                 style="width: 100%; max-height: 450px; object-fit: contain;">
            {{/post.imageFilename}}

            {{^post.imageFilename}}
            <p>No image available.</p>
            {{/post.imageFilename}}

        </div>
        {{/isEdit}}

    </div>
</div>

{{> footer}}
