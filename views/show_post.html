<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>GAMELINE - A web for browsing videogames</title>

    <!-- Favicon (absolute path, so it works from any URL) -->
    <link rel="icon" type="image/png" href="/img/gameline.png" />
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <!-- Core theme CSS (includes Bootstrap). Absolute path: it must not depend on the page URL -->
    <link href="/styles.css" rel="stylesheet" />
</head>

<body>
    {{> header}}

<main class="container py-5">
    <div class="row gx-5">

        <!-- Imagen del juego (solo si tiene) -->
        <div class="col-md-6">
            {{#post.imageFilename}}
            <img class="img-fluid rounded w-100" src="/post/{{post._id}}/image" alt="{{post.Title}}">
            {{/post.imageFilename}}
        </div>

        <!-- Datos del juego y botones -->
        <div class="col-md-6">
            <h1 class="fw-bolder">{{post.Title}}</h1>
            <p><strong>Company:</strong> {{post.company}}</p>
            <p><strong>Date:</strong> {{post.date}}</p>
            <p><strong>Price:</strong> ${{post.price}}</p>
            <p><strong>Genre:</strong> {{post.genre}}</p>

            <div class="d-flex gap-2 mt-3">
                <a href="/" class="btn btn-secondary">Back to Store</a>
                <a href="/post/{{post._id}}/edit" class="btn btn-primary">Edit Game</a>

                <!-- Borrar es un formulario POST para no borrar datos con un simple enlace -->
                <form action="/post/{{post._id}}/delete" method="post">
                    <button type="submit" class="btn btn-danger">Delete Game</button>
                </form>
            </div>
        </div>
    </div>
</main>

{{> footer}}
