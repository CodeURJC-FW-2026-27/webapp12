<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GAMELINE - A web for browsing videogames</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <!-- Same CSS in the entire website (absolute path so it works on any page) -->
    <link href="/styles.css" rel="stylesheet" />
</head>

<body class="d-flex flex-column min-vh-100">
    <!-- Top bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container px-4 px-lg-5">
            <img src="/img/gameline.png" alt="Logo" width="48" height="48" class="d-inline-block align-text-top">
            <a class="navbar-brand" href="/">GAMELINE</a>
             <!-- Title search, shown on every page. It sends the typed letters to the main page -->
            <form action="/" method="get" class="d-flex" role="search">
                {{#genre}}<input type="hidden" name="genre" value="{{.}}">{{/genre}}
                <input type="text" name="search" value="{{search}}" placeholder="Search..."
                       aria-label="Search by title" class="form-control me-2">
                <button type="submit" class="btn btn-outline-dark border border-2 text-white">Search</button>
            </form>
    </nav>
