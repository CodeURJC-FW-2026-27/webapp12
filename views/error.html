
{{> header}}

    <main class="container py-5 text-center">
        <h1 class="mb-4">Error</h1>

        <!-- Error messages -->
        <div class="alert alert-danger text-start" style="max-width: 600px; margin: 0 auto;">
            <ul class="mb-0">
                <!-- Mustache.js iterates over the array of errors and displays each one in a list item -->
                {{#errors}}
                <li>{{.}}</li>
                {{/errors}}
            </ul>
        </div>
                <!-- Button that leads to the appropriate page: the URL and text are decided by the server -->
        <a href="{{backUrl}}" class="btn btn-primary mt-4">{{backText}}</a>
    </main>

   {{> footer}}
