
{{> header}}

    <main class="container py-5 text-center">
        <h1 class="mb-4">Error</h1>

        <!-- Cuadro rojo con los mensajes de error -->
        <div class="alert alert-danger text-start" style="max-width: 600px; margin: 0 auto;">
            <ul class="mb-0">
                <!-- Mustache repite este <li> una vez por cada error de la lista "errors" -->
                {{#errors}}
                <li>{{.}}</li>
                {{/errors}}
            </ul>
        </div>
                <!-- Botón que lleva a la página adecuada: la URL y el texto los decide el servidor -->
        <a href="{{backUrl}}" class="btn btn-primary mt-4">{{backText}}</a>
    </main>

   {{> footer}}
