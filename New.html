<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-wid,initial-scale=1">
    <title>Nuevo Juego | GAMELINE </title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
<link href="styles.css" rel="stylesheet" />
</head>
<body>
    <main class="container py-5">
        <h1 class="mb-4">Nuevo Juego</h1>
         
      <!--CREACION DE LOS CAMPOS-->  
      <form class="row g-3" style="max-width: 760px">
 <div class="col-12">
    <label for="name" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="name" name="name" required>
 </div> 

 <div class="col-md-6">
    <label for="company" class="form-label">Compañia</label>
    <input type="text" class="form-control" id="company" name="company" required>
 </div> 
 
    <div class="col-md-4">
    <label for="price" class="form-label">Fecha de lanzamiento</label>
    <input type="text" class="form-control" id="date" name="date" placeholder="DD/MM/YY" required>
 </div> 
  
   <div class="col-md-4">
    <label for="date" class="form-label">Precio($)</label>
    <input type="number" class="form-control" id="price" name="price" min="0" required>
 </div> 
 
<div class="col-md-4">
    <label for="cover" class="form-label">Imagen</label>
    <input type="file" class="form-control" id="cover" name="cover" accept="image/*" required>
 </div> 

      </form>  
    
    </main>

   

<!--BOTONES GUARDAR Y SALIR-->
<div class="col-12 d-flex gap-2">
    <button type="button" class="btn btn-primary">Guardar </button>
    <a href="index.html" class="btn btn-secondary">Cancelar </button>
</div>
</body>
</html>
