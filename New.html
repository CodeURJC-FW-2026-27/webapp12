<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-wid,initial-scale=1">
    <title>Nuevo Juego | GAMELINE </title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
<link href="styles.css" rel="stylesheet" />
</head>
<body>
    <main class="container py-5">
        <h1 class="mb-4">New Game</h1>
         
      <!--CREACION DE LOS CAMPOS-->  
      <form class="row g-3" style="max-width: 760px">
 <div class="col-12">
    <label for="name" class="form-label">Name</label>
    <input type="text" class="form-control" id="name" name="name" required>
 </div> 

 <div class="col-md-6">
    <label for="company" class="form-label">Company</label>
    <input type="text" class="form-control" id="company" name="company" required>
 </div> 
 
    <div class="col-md-4">
    <label for="price" class="form-label">Release Date</label>
    <input type="text" class="form-control" id="date" name="date" placeholder="DD/MM/YY" required>
 </div> 
  
   <div class="col-md-4">
    <label for="date" class="form-label">Price($)</label>
    <input type="number" class="form-control" id="price" name="price" min="0" required>
 </div> 
 
<div class="col-md-4">
    <label for="cover" class="form-label">Image</label>
    <input type="file" class="form-control" id="cover" name="cover" accept="image/*" required>
 </div> 

 <label for="Genre">Genre</label><br>
 <select id="genre" name="genre">
    <option value="all" selected>All genres</option>
        <option value="action" selected>Action</option>
        <option value="adventure" selected>Adventure</option>
        <option value="rpg" selected>Role-playing / RPG </option>
        <option value="strategy" selected>Strategy</option>
        <option value="Fighting" selected>Fighting</option>
        <option value="all" selected>All genres</option>
        <option value="simulation" selected>Simulation</option>
        <option value="Sport & Driving " selected>Sport & Driving </option>
            <option value="Puzzle & Rhythm" selected>Puzzle & Rhythm</option>
 </select><br>

      </form>  
    
    </main>

   

<!--BOTONES GUARDAR Y SALIR-->
<div class="col-12 d-flex gap-2">
    <button type="button" class="btn btn-primary">Save </button>
    <a href="index.html" class="btn btn-secondary">Cancel </a>
</div>
</body>
</html>
